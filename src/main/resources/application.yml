server:
  port: 8080
  # 本工具提供目录浏览与文件就地改写能力，且无鉴权，默认只监听本机回环地址。
  # 确需从其他机器访问时再显式覆盖，例如 SERVER_ADDRESS=0.0.0.0，并自行做好网络隔离。
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: classpath:/static/

app:
  ai:
    # AI 配置持久化文件（与 jar 分离，重新部署不丢失）
    # 支持相对路径（相对于启动目录）或绝对路径
    config-file: ${AI_CONFIG_FILE:config/ai-config.json}
    auto-optimize:
      # 自动处理模式下，每次扫描最多有多少条 SQL 交给 AI 优化
      max-items: 200
      # AI 优化阶段的并发线程数
      concurrency: 4

# ⚠️ 以下 anthropic.api.* 仅用于「首次启动」时生成一条默认 AI 配置，
#    之后所有 AI 厂商/协议/地址/模型/Key 均在网页「AI配置」菜单中维护，
#    修改这里不会影响已保存的配置。
anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    model: ${ANTHROPIC_MODEL:qwen-max-latest}
    vision-model: ${ANTHROPIC_VISION_MODEL:qwen-vl-max-latest}

logging:
  level:
    com.dbconverter: DEBUG
  file:
    name: logs/db-converter.log
