  shentong:
    functions:
      NOW: CURRENT_TIMESTAMP
      CONCAT: CONCAT
      IFNULL: COALESCE
      DATE_FORMAT: "TO_CHAR({0}, {1})"
      DATE_ADD: "({0} + {1})"
      DATE_SUB: "({0} - {1})"
      SUBSTRING: "SUBSTR"
      LENGTH: LENGTH
    types:
