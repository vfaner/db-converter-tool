    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .app-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);

        .sidebar-header {

        }
        .sidebar-header h1 {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .sidebar-header p {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            margin-top: 5px;
        }
        .menu {
            padding: 20px 0;
            flex: 1;
        }
        .menu-item {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 3px solid transparent;
        }
        .menu-item:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }
        .menu-item.active {
            background: rgba(102, 126, 234, 0.2);

        }
        .menu-icon {

            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .page-header {
            margin-bottom: 25px;
        }
        .page-header h2 {
            color: #fff;
            font-size: 28px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .page-header p {
            color: rgba(255,255,255,0.8);
            margin-top: 8px;
            font-size: 14px;
        }
        .content-card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .section {
            margin-bottom: 35px;
        }
        .section:last-child {
            margin-bottom: 0;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
            margin-right: 10px;
        }
        .section-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 18px;
        }
        .qr-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            width: 100%;
            max-width: 760px;
        }
        .qr-wrapper img {
            width: 100%;
            max-width: 720px;
            height: auto;
            display: block;
            object-fit: contain;
            border-radius: 8px;
            background: #fff;
            padding: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .qr-wrapper .qr-caption {

            font-size: 13px;
            color: #999;
        }
        .update-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px 24px;

            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
        }
        .update-box .repo-link:hover {
            text-decoration: underline;
        }
        .star-tip {
            display: inline-block;
            margin-top: 10px;
            font-size: 13px;
            color: #666;

                            </div>
                            <a class="repo-link" href="https://github.com/vfaner/db-converter-tool" target="_blank" rel="noopener">
                                🔗 https://github.com/vfaner/db-converter-tool
                            </a>
                            <div>

                            </div>

                </div>

    <script>

        const app = createApp({});
        app.use(ElementPlus);
